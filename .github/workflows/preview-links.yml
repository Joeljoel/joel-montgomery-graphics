name: Cloudflare preview links
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  checks: read
  pull-requests: write
concurrency:
  group: preview-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  comment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const args = { owner, repo, issue_number: pr.number };
            const marker = '<!-- worker-preview-links -->';
            for (let attempt = 0; attempt < 80; attempt++) {
              const comments = await github.paginate(github.rest.issues.listComments, args);
              if (comments.some(c => c.user?.type === 'Bot' && /<!-- Preview URL -->/.test(c.body) && c.body.includes(pr.head.sha.slice(0, 7)))) return;
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha });
              const build = data.check_runs.find(c => c.app?.slug === 'cloudflare-workers-and-pages' && c.name === 'Workers Builds: joel-montgomery-graphics');
              if (build?.status === 'completed' && build.conclusion !== 'success') {
                throw Error('Cloudflare build ended with ' + build.conclusion);
              }
              if (build?.conclusion === 'success') {
                const slug = new URL(build.details_url).pathname.match(/\/previews\/([a-z0-9-]+)\/builds\//)?.[1];
                if (!slug) throw Error('Could not identify the preview branch from the Cloudflare check.');
                const base = 'https://' + slug + '-joel-montgomery-graphics.joelmontgomery11.workers.dev';
                const response = await fetch(base + '/tools/', { redirect: 'manual', signal: AbortSignal.timeout(10000) });
                if (response.ok && (await response.text()).includes('Design Utilities')) {
                  const body = marker + '\n**Cloudflare preview** · [Site](' + base + '/) · [Utilities](' + base + '/tools/) · [Image Reference Grid](' + base + '/tools/image-grid/) · [PDF Inspector](' + base + '/tools/pdf-inspector/)';
                  const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
                  if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                  else if (!comments.some(c => c.body === body)) await github.rest.issues.createComment({ ...args, body });
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw Error('Timed out waiting for a successful, reachable Cloudflare preview.');

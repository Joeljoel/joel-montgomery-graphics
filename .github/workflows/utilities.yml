name: Utility checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  utilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs tools/*/*.test.mjs
      - run: npm install --prefix /tmp/utility-tests playwright@1.56.1 pngjs@7.0.0
      - name: Run browser regressions
        env:
          NODE_PATH: /tmp/utility-tests/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 --bind localhost >/tmp/server.log 2>&1 &
          curl --retry 10 --retry-connrefused -fsS http://localhost:8765/ >/dev/null
          for suite in pdf-inspector.browser utilities-shell trim stretchrepeat-normalize shape-mask-thumbnail; do
            node "tests/$suite.test.cjs"
          done

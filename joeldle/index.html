<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="improved.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&amp;display=swap&amp;text=ABCDEFGHIJKLMNOPQRSTUVWXYZ">
    <title>Joeldle</title>
</head>
<body class="improved"><div class="duo-backdrop" aria-hidden="true"></div><nav class="modes" aria-label="Game appearance"><button type="button" data-mode="legacy" aria-pressed="false">Legacy</button><button type="button" data-mode="improved" aria-pressed="true">Improved</button></nav>
    <header>
        Joeldle
    </header>
    <div class="round-info"><span id="roundKind">Daily puzzle</span><button id="viewResult" hidden>View result</button><span id="roundCount" role="status">Guess 1 / 6</span></div>
    <div class="fetch-info"><span id="fetchStatus" role="status"></span><button id="retry" hidden>Retry</button></div>
    <div id="message" role="status"></div>
    <div id="streak"></div>
    <div class="game" role="group" aria-label="Guess board" tabindex="-1">
        <div class="row row1">
            <input class="letter a1" id="start" maxlength="1">
            <input class="letter a1" maxlength="1">
            <input class="letter a1" maxlength="1">
            <input class="letter a1" maxlength="1">
            <input class="letter a1 final" maxlength="1">
        </div>
        <div class="row row2">
            <input class="letter a2" id="2" maxlength="1" disabled>
            <input class="letter a2" maxlength="1" disabled>
            <input class="letter a2" maxlength="1" disabled>
            <input class="letter a2" maxlength="1" disabled>
            <input class="letter a2 final" maxlength="1" disabled>
        </div>
        <div class="row row3">
            <input class="letter a3" id="3" maxlength="1" disabled>
            <input class="letter a3" maxlength="1" disabled>
            <input class="letter a3" maxlength="1" disabled>
            <input class="letter a3" maxlength="1" disabled>
            <input class="letter a3 final" maxlength="1" disabled>
        </div>
        <div class="row row4">
            <input class="letter a4" id="4" maxlength="1" disabled>
            <input class="letter a4" maxlength="1" disabled>
            <input class="letter a4" maxlength="1" disabled>
            <input class="letter a4" maxlength="1" disabled>
            <input class="letter a4 final" maxlength="1" disabled>
        </div>
        <div class="row row5">
            <input class="letter a5" id="5" maxlength="1" disabled>
            <input class="letter a5" maxlength="1" disabled>
            <input class="letter a5" maxlength="1" disabled>
            <input class="letter a5" maxlength="1" disabled>
            <input class="letter a5 final" maxlength="1" disabled>
        </div>
        <div class="row row6">
            <input class="letter a6" id="6" maxlength="1" disabled>
            <input class="letter a6" maxlength="1" disabled>
            <input class="letter a6" maxlength="1" disabled>
            <input class="letter a6" maxlength="1" disabled>
            <input class="letter a6 final" maxlength="1" disabled>
        </div>
    </div>
    <section class="keys" aria-label="Letter keyboard"><div class="legend"><span>Untested</span><span>Absent</span><span>Present</span><span>Correct</span></div></section>
    <div class="prizes prizeHidden" id="prizes">
        <button onclick="playRandom()">Play random?</button>
    </div>
    <dialog id="resultSheet" aria-labelledby="resultTitle"><form method="dialog"><button aria-label="Close result">×</button></form><small>JOELDLE</small><h2 id="resultTitle">Round complete</h2><p id="resultNote"></p><div class="sheet-actions"><button class="copy-result">Copy result</button><button id="again">Play again</button></div><output id="copied" role="status"></output></dialog>
    <script src="./script.js"></script>
<script src="improved.js"></script>
</body>
</html>

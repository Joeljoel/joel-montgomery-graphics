<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="PDF page with bleed and trim guides">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#f3efe4"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.8" flood-color="#2c3e50" flood-opacity=".18"/>
    </filter>
  </defs>
  <!-- Soft layered cut-paper silhouette, matching the other utility illustrations. -->
  <g filter="url(#shadow)">
    <path d="M21 13h37l15 15v57H21z" fill="#e1ded7"/>
    <path d="M25 9h34l14 14v59H25z" fill="url(#paper)" stroke="#d5cfc2" stroke-width="1.3"/>
    <path d="M59 9v14h14" fill="#e9e3d7" stroke="#d5cfc2" stroke-width="1.3"/>
  </g>
  <!-- Blue band marks the extra production bleed area. -->
  <rect x="32" y="30" width="35" height="43" rx="1.3" fill="#aed4ff" stroke="#468cd8" stroke-width="1.4"/>
  <!-- Black dashed line is the intended finished trim. -->
  <rect x="37" y="35" width="25" height="33" fill="#fffdfa" stroke="#253f5d" stroke-dasharray="3 2.2" stroke-width="1.4"/>
  <g stroke="#c8cdd0" stroke-width="1.5" stroke-linecap="round">
    <path d="M42 45h14M42 50h11M42 59h14"/>
  </g>
  <!-- Trim / bleed measurement ticks, intentionally bold at icon scale. -->
  <g fill="none" stroke="#166fd5" stroke-width="1.8" stroke-linecap="round">
    <path d="M33 24h33M33 21v6M66 21v6"/>
    <path d="M77 31v40M74 31h6M74 71h6"/>
  </g>
  <path d="m36 22-3 2 3 2m27-4 3 2-3 2M75 35l2-4 2 4m-4 32 4 4 2-4" fill="none" stroke="#166fd5" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="15" y="60" width="22" height="18" rx="4" fill="#2184fc"/>
  <text x="26" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="white">PDF</text>
</svg>

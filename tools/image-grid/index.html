<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Reference Grid</title><link rel="stylesheet" href="styles.css"><body><main><section class="card"><header><img src="../assets/easilLogo.png" width="24" height="24" alt=""><h1>Image Reference Grid</h1></header><p>Save the image-list page in your browser, then drop its HTML file here. You can also paste the entire page HTML or image links.</p><button id="drop">Choose or drop an HTML file</button><input id="file" type="file" accept=".html,.htm,.txt" hidden><textarea id="paste" rows="5" placeholder="Paste page HTML or image links"></textarea><button id="load">Find images</button><p id="status" role="status"></p><div id="options" hidden><div class="options"><label>Columns <input id="columns" type="number" min="1" max="10" value="3"></label><label>Spacing <input id="spacing" type="number" min="0" max="80" value="16"></label><label>Background <input id="background" type="color" value="#ffffff"></label></div><button id="all">Select all</button> <button id="none">Select none</button> <button id="show">Screenshot view</button><p>Select the images to include. In screenshot view, press Escape or click anywhere to return.</p></div><div id="grid"></div></section><nav><a href="../">All utilities</a></nav></main><div id="sheet" hidden title="Click to return"></div><script src="script.js"></script></body></html>
